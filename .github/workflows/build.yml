name: Build and Release Media Hub

on:
  push:
    tags:
      - 'v*' # Trigger solo cuando creas un tag como v1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Generate Release Tag Name and version.json
        id: tag_name
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "refs/tags/") {
            $raw_tag = "${{ github.ref_name }}"
          } else {
            $date = Get-Date -Format "yyyyMMdd-HHmm"
            $raw_tag = "v$date"
          }
          $clean_ver = $raw_tag.TrimStart('v')
          @{ version = $clean_ver } | ConvertTo-Json | Set-Content -Path "version.json" -Encoding utf8
          Write-Host "Injected version.json: $clean_ver (Tag: $raw_tag)"
          echo "TAG=$raw_tag" >> $env:GITHUB_OUTPUT
          echo "CLEAN_VERSION=$clean_ver" >> $env:GITHUB_OUTPUT

      - name: Update Inno Setup AppVersion
        shell: pwsh
        run: |
          $ver = "${{ steps.tag_name.outputs.CLEAN_VERSION }}"
          (Get-Content Media-Hub.iss) -replace 'AppVersion=.*', "AppVersion=$ver" | Set-Content Media-Hub.iss
          Write-Host "Updated Media-Hub.iss AppVersion to $ver"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: pyinstaller main.spec

      - name: Build Installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: Media-Hub.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG }}
          name: Media Hub Release ${{ steps.tag_name.outputs.TAG }}
          files: |
            Output/*.exe
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
