name: CI - Pull Request Verification

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - launcher-modular
  workflow_dispatch:

env:
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"

jobs:
  validate:
    name: Code & Build Verification
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flake8
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

      - name: Python Syntax & Compilation Check
        shell: pwsh
        run: |
          Write-Host "Verificando sintaxis de todos los archivos Python..."
          python -m compileall -q .
          Write-Host "[OK] Sintaxis y compilacion correcta en todos los archivos."

      - name: Lint Check (Critical Errors)
        shell: pwsh
        run: |
          # Detiene el PR si hay errores de sintaxis, variables indefinidas o nombres rotos (E9, F63, F7, F82)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Smoke Test (Import Verification)
        shell: pwsh
        run: |
          # Verifica que el punto de entrada principal importe sin errores
          python -c "import main; print('[OK] main.py se importa limpiamente')"

      - name: PyInstaller Spec Syntax Validation
        shell: pwsh
        run: |
          if (Test-Path main.spec) {
            Write-Host "Validando sintaxis de main.spec..."
            python -c "import py_compile; py_compile.compile('main.spec', doraise=True); print('[OK] main.spec es valido')"
          }
